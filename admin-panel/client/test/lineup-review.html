window.connectMockGame=async()=>{
 const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;
 const ctx=canvas.getContext('2d');const draw=()=>{ctx.fillStyle='#20232a';ctx.fillRect(0,0,640,360);ctx.fillStyle='#528597';ctx.fillRect(2,24,636,334);};

window.checkReview=async()=>{
 const tick=()=>new Promise(r=>setTimeout(r,80));
 const assert=(ok,msg)=>{if(!ok)throw Error(msg);};
 const steps=[...document.querySelectorAll('.review-step')];
 assert(steps.length===6,'Sechs Schritte fehlen');
 for(let i=0;i<steps.length;i++){steps[i].click();await tick();assert(document.querySelector('[aria-current="step"]')===steps[i],'Schrittnavigation fehlt');}
 assert(document.querySelectorAll('.review-checklist button').length===5,'Checkliste fehlt');
 assert([...document.querySelectorAll('button')].find(b=>b.textContent==='Offiziell freigeben').disabled,'Unvollständiger Review freigebbar');
 assert(document.documentElement.scrollWidth<=innerWidth,'Seite läuft horizontal über');
 steps[0].click();await tick();return 'PASS: sechs Schritte, Checkliste, Freigabesicherung, kein horizontaler Seitenüberlauf';
};
window.checkRecorder=async()=>{
 const canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;
 const ctx=canvas.getContext('2d');let frame=0;
 const paint=setInterval(()=>{ctx.fillStyle=frame++%2?'#4b8977':'#786248';ctx.fillRect(0,0,640,360);},30);
 const recorder=new ReviewRecorder(canvas.captureStream(30));
 try{await recorder.video.play();await new Promise(r=>setTimeout(r,100));recorder.setPhotoFrame({width:640,height:360,top:0,right:0,bottom:0,left:0});const photo=await recorder.photo('aim');if(photo.type!=='image/jpeg'||!photo.size)throw Error('Foto leer');
 const result=recorder.startVideo(()=>{});await new Promise(r=>setTimeout(r,1300));recorder.stopVideo();const video=await result;if(video.type!=='video/webm'||!video.size)throw Error('Video leer');return {photo:photo.size,video:video.size,result:'PASS: echte JPEG- und WebM-Aufnahme'};
 }finally{recorder.dispose();clearInterval(paint);}
};

// Simulate a flight measurement arriving from CS2 while this detail page is open.
// The actual UploadThing client must submit the refreshed revision on retry.
window.checkStaleRetry=async(changedSetup=false)=>{
 const current={...nade,flightDuration:7.40625,updatedAt:'2026-10-02T09:59:12.9327389+00:00'};
 if(changedSetup)current.lineupAng='-10 20 0';
 const attempts=[];let reads=0;
 window.fetch=async(url,options)=>{
  if(String(url).includes('/api/uploadthing')){
   attempts.push(JSON.parse(options.body).input);
   if(attempts.length===1&&!changedSetup)current.updatedAt='2026-10-02T10:00:00.0000000+00:00';
   return new Response(JSON.stringify({message:'Das Lineup wurde geändert. Bitte aktualisieren.',code:'BAD_REQUEST'}),{status:400,headers:{'Content-Type':'application/json'}});
  }
  if(String(url)==='/api/nades')reads++;
  return new Response(JSON.stringify({entries:[current],uploadEnabled:true}),{headers:{'Content-Type':'application/json'}});
 };
 const tick=()=>new Promise(r=>setTimeout(r,50));
 const waitFor=async(predicate)=>{for(let i=0;i<100;i++){if(predicate())return;await tick();}throw Error('Zeitüberschreitung');};
 const input=document.querySelector('input[type=file]'),transfer=new DataTransfer();
 transfer.items.add(new File(['test'], 'aim.jpg',{type:'image/jpeg'}));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));
 await waitFor(()=>[...document.querySelectorAll('button')].some(b=>b.textContent==='Upload erneut versuchen'&&!b.disabled));
 if(changedSetup&&attempts.length)throw Error('Geänderte Wurfdaten wurden ungeprüft hochgeladen');
 [...document.querySelectorAll('button')].find(b=>b.textContent==='Upload erneut versuchen').click();
 await waitFor(()=>attempts.length>=(changedSetup?1:2));
 if(attempts.at(-1).revision!==current.updatedAt)throw Error('Upload erneut versuchen sendet weiterhin die veraltete Version: '+JSON.stringify({attempts,reads}));
 return {result:changedSetup?'PASS: Geänderte Wurfdaten verlangen Prüfung vor dem Upload':'PASS: Retry aktualisiert die Version und behält das Foto',attempts:attempts.length,reads};
};
// Exercise the actual three copy buttons with unavailable/denied Clipboard API.
window.checkClipboard=async(mode='missing')=>{
 const descriptor=Object.getOwnPropertyDescriptor(navigator,'clipboard');
 const originalCopy=document.execCommand;const copied=[];
 const api=mode==='missing'?undefined:{writeText:async text=>{if(mode==='modern'){copied.push(text);return;}throw new DOMException('Denied','NotAllowedError');}};
 Object.defineProperty(navigator,'clipboard',{configurable:true,value:api});
 document.execCommand=command=>{if(mode==='blocked')return false;if(command!=='copy'||document.activeElement?.tagName!=='TEXTAREA')throw Error('Ungültiger Fallback');copied.push(document.activeElement.value);return true;};
 try{
  document.querySelector('details').open=true;
  const labels=['Crosshair-Code kopieren','Fotomodus-Befehl kopieren','HUD und Waffe einschalten · Befehl kopieren'];
  for(const label of labels){
   const button=[...document.querySelectorAll('button')].find(b=>b.textContent===label);button.focus();button.click();await new Promise(r=>setTimeout(r,80));
   const text=button.parentElement.textContent;
   if(mode==='blocked'){if(!text.includes('Bitte den Text markieren')||text.includes('Kopiert'))throw Error('Fehlermeldung oder Erfolg falsch');}
   else if(button.textContent!=='Kopiert')throw Error('Kopieren fehlgeschlagen: '+text);
   if((mode==='missing'&&document.activeElement!==button)||document.querySelector('textarea[aria-hidden=true]'))throw Error('Fokus/temporäres Textfeld nicht aufgeräumt');
  }
  if(mode!=='blocked'&&(copied.length!==3||copied[0]!==document.querySelector('input[aria-label="Review-Crosshair-Code"]').value||copied[1]!=='cl_draw_only_deathnotices 1; r_drawviewmodel 0'||copied[2]!=='cl_draw_only_deathnotices 0; r_drawviewmodel 1'))throw Error('Falscher Inhalt kopiert');
  return {result:'PASS',mode,copies:copied.length};
 }finally{document.execCommand=originalCopy;if(descriptor)Object.defineProperty(navigator,'clipboard',descriptor);else delete navigator.clipboard;}
};
</script></body></html>
