<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offizielle Lineup-Präsentation prüfen</title></head><body><main id="root" style="max-width:1800px;margin:24px auto;padding:0 16px"></main><script type="module">
import React, {useState} from 'react';
import {createRoot} from 'react-dom/client';
import {MemoryRouter, Route, Routes} from 'react-router-dom';
import {NadeLibrary} from '/src/components/nade-library.tsx';
import {LineupPage} from '/src/components/lineup-page.tsx';
import {NadeFavoritesProvider} from '/src/components/nade-favorites.tsx';
import {ACTIVE_DUTY_MAPS} from '/src/lib/maps.ts';
import '/src/index.css';

const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;
const ctx=canvas.getContext('2d');
function draw(){ctx.fillStyle='#263c43';ctx.fillRect(0,0,960,540);ctx.fillStyle='#b6a88d';ctx.fillRect(0,90,455,450);ctx.fillStyle='#dfcdb0';ctx.fillRect(455,120,300,420);ctx.fillStyle='#b07032';ctx.fillRect(470,360,490,90);ctx.strokeStyle='#78ff48';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(474,270);ctx.lineTo(486,270);ctx.moveTo(480,264);ctx.lineTo(480,276);ctx.stroke();}
draw();const photo=canvas.toDataURL('image/png');
const stream=canvas.captureStream(12), recorder=new MediaRecorder(stream,{mimeType:'video/webm'}), chunks=[];
recorder.ondataavailable=event=>chunks.push(event.data);
const stopped=new Promise(resolve=>recorder.onstop=resolve);
recorder.start();const frames=setInterval(draw,75);await new Promise(resolve=>setTimeout(resolve,800));recorder.stop();await stopped;clearInterval(frames);stream.getTracks().forEach(track=>track.stop());
const video=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
const reviewMedia={video:{key:'demo-video',url:video},...Object.fromEntries(['aim','position','front','effect'].map(slot=>[slot,{key:slot,url:photo}]))};
const owner='76561198000000001',user={identitySteam64:owner,role:'admin'};
let entries=[{id:'Demo123',owner,map:'de_mirage',name:'window',displayName:'Fenster vom T-Spawn',type:'Smoke',team:'t',official:true,mustKnow:true,reviewStatus:'approved',updatedAt:'2026-10-03T12:00:00.000Z',reviewMedia,throwFromTitle:'T-Spawn',throwToTitle:'Fenster',desc:'An der Kante stehen. Auf die obere Ecke der Wand zielen und die Smoke im Sprung werfen.',radarFrom:{x:.25,y:.75},radarTo:{x:.55,y:.2},lineupPos:'1 2 3',lineupAng:'0 90 0',flightDuration:3.125,is_jumpthrow:true,is_crouch:false,is_walking:false,is_running:false,is_stepping:false,click_type:'left'}];
window.fetch=async()=>new Response(JSON.stringify({entries:[]}),{headers:{'Content-Type':'application/json'}});
const overview=new URLSearchParams(location.search).has('overview');
function App(){const [nades,setNades]=useState(entries);window.setRecording=patch=>{entries=entries.map(entry=>({...entry,...patch}));setNades(entries);};window.setEntries=next=>{entries=next;setNades(next);};return React.createElement(MemoryRouter,{initialEntries:[overview?'/maps/mirage':'/maps/mirage/lineups/Demo123']},React.createElement(NadeFavoritesProvider,null,React.createElement(Routes,null,React.createElement(Route,{path:'/maps/:mapSlug',element:React.createElement(NadeLibrary,{maps:ACTIVE_DUTY_MAPS,nades,user})}),React.createElement(Route,{path:'/maps/:mapSlug/lineups/:lineupId',element:React.createElement(LineupPage,{maps:ACTIVE_DUTY_MAPS,nades,user,onEntriesChange:setNades,onRefresh:async()=>{}})}))));}
createRoot(document.getElementById('root')).render(React.createElement(App));
const waitFor=async fn=>{for(let i=0;i<120;i++){if(fn())return;await new Promise(resolve=>setTimeout(resolve,25));}throw Error('Zeitüberschreitung: '+document.body.innerText);};
const assert=(value,message)=>{if(!value)throw Error(message);};
const button=text=>[...document.querySelectorAll('button')].find(button=>button.textContent===text);
const shift=type=>window.dispatchEvent(new KeyboardEvent(type,{key:'Shift',bubbles:true}));
const alt=type=>window.dispatchEvent(new KeyboardEvent(type,{key:'Alt',bubbles:true,cancelable:true}));
window.checkDetail=async()=>{
 await waitFor(()=>document.querySelector('.lineup-hero-video')?.readyState>=2);
 const video=document.querySelector('.lineup-hero-video');
 assert(!video.hidden,'Video nicht im Vordergrund');
 assert(!document.querySelector('.official-photo-picker'),'Bilder trotz Videoansicht geöffnet');
 assert(!document.querySelector('.official-lineup-instructions').textContent.includes('Shift'),'Shift-Hinweis steht in der Anleitung');
 video.muted=true;video.loop=true;await video.play();
 shift('keydown');await waitFor(()=>document.querySelector('.official-photo-viewport img')?.style.transform==='scale(3)');
 assert(video.hidden&&video.paused,'Video läuft hinter der Shift-Ansicht weiter');
 alt('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Wirkung am Ziel');
 assert(!document.querySelector('.official-photo-viewport img').style.transform,'Wirkung wird ungewollt gezoomt');
 shift('keyup');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 shift('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Wirkung am Ziel');
 alt('keyup');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent.includes('Fadenkreuz-Zoom'));
 shift('keyup');await waitFor(()=>!video.hidden&&!video.paused);
 alt('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 alt('keyup');await waitFor(()=>!video.hidden&&!video.paused);
 button('Lineup').click();await waitFor(()=>document.querySelectorAll('.official-photo-picker button').length===4);
 button('Standposition').click();await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 shift('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent.includes('Fadenkreuz-Zoom'));
 shift('keyup');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 button('Ausrichtung').click();await waitFor(()=>button('Fadenkreuz-Zoom'));
 button('Fadenkreuz-Zoom').click();await waitFor(()=>document.querySelector('.crosshair-viewport img'));
 assert(document.querySelector('.crosshair-viewport img').style.transform==='scale(3)','Dialogzoom fehlt');
 button('Ganzes Bild').click();await waitFor(()=>document.querySelector('.crosshair-viewport img').style.transform==='scale(1)');
 document.querySelector('button:has(.sr-only)').click();await waitFor(()=>!document.querySelector('.crosshair-viewport'));
 assert(document.documentElement.scrollWidth<=innerWidth,'Horizontaler Überlauf');
 window.setRecording({official:false});await waitFor(()=>!document.querySelector('.official-lineup-detail'));
 assert(!document.querySelector('.official-view-switch'),'Neue Ansicht gilt für Entwürfe');
 window.setRecording({official:true});await waitFor(()=>document.querySelector('.official-view-switch'));
 return 'PASS: Video, Pausieren und Fortsetzen, Shift/Alt/Shift+Alt, Bildauswahl, Zoomdialog, Entwurfsgrenze und Layout';
};
window.checkRadarPreview=async()=>{
 await waitFor(()=>document.querySelector('.radar-spot'));
 document.querySelector('.radar-spot').click();await waitFor(()=>document.querySelector('.radar-spot-from'));
 const marker=document.querySelector('.radar-spot-from');
 marker.dispatchEvent(new MouseEvent('mouseover',{bubbles:true,relatedTarget:document.body}));await waitFor(()=>document.querySelector('.radar-preview-media'));
 assert(!document.querySelector('.radar-preview strong')&&!document.querySelector('.radar-preview button'),'Vorschau enthält Namen oder Zusatzbuttons');
 shift('keydown');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Ausrichtung'));
 alt('keydown');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Wirkung am Ziel'));
 assert(!document.querySelector('.radar-preview-photo-zoom'),'Wirkung wird gezoomt');
 shift('keyup');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Standposition'));
 alt('keyup');await waitFor(()=>!document.querySelector('.radar-preview-photo'));
 alt('keydown');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Standposition'));
 alt('keyup');await waitFor(()=>!document.querySelector('.radar-preview-photo'));
 marker.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,shiftKey:true}));await waitFor(()=>document.querySelector('.crosshair-viewport'));
 document.querySelector('.crosshair-dialog button:has(.sr-only)').click();await waitFor(()=>!document.querySelector('.crosshair-viewport'));
 assert(document.querySelector('.radar-spot-from'),'Kartenauswahl geht beim Schließen verloren');
 window.setRecording({official:false});await new Promise(resolve=>setTimeout(resolve,100));
 document.querySelector('.radar-spot-from').dispatchEvent(new MouseEvent('mouseover',{bubbles:true,relatedTarget:document.body}));await new Promise(resolve=>setTimeout(resolve,220));
 assert(!document.querySelector('.radar-preview'),'Entwurf erhält Vorschau');
 window.setRecording({official:true});await new Promise(resolve=>setTimeout(resolve,100));
 window.setEntries([entries[0],{...entries[0],id:'Demo124',name:'second',displayName:'Zweite Smoke',reviewMedia:{...reviewMedia,video:{...reviewMedia.video,key:'second-video'}}}]);await waitFor(()=>document.querySelector('.radar-spot-from button')||document.querySelector('.radar-spot-from .radar-marker-label'));
 document.querySelector('.radar-spot-from').dispatchEvent(new MouseEvent('mouseover',{bubbles:true,relatedTarget:document.body}));await waitFor(()=>document.querySelector('.radar-preview button[aria-label="Zweite Smoke"]'));
 document.querySelector('.radar-preview button[aria-label="Zweite Smoke"]').click();await waitFor(()=>document.querySelector('.radar-preview button[aria-label="Zweite Smoke"]').getAttribute('aria-pressed')==='true');
 assert(document.documentElement.scrollWidth<=innerWidth,'Horizontaler Überlauf');
 return 'PASS: Kompakte Vorschau, Shift/Alt/Shift+Alt, Shift-Klick, geschützte Kartenauswahl, Entwurfsgrenze und gestapelte Lineups';
};
</script></body></html>
