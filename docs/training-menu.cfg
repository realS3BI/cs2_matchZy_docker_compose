// Default CLIENT binds for the fixed HUD (1.5+). Back up existing binds first.
// For personal settings, run css_training_binds and use its output instead.
// Bind names are interpreted using your per-Steam-ID settings on the server.
bind "F6" "css_training_key F6"
bind "F7" "css_training_key F7"
bind "F8" "css_training_key F8"
bind "UPARROW" "css_training_key UPARROW"
bind "DOWNARROW" "css_training_key DOWNARROW"
bind "LEFTARROW" "css_training_key LEFTARROW"
bind "RIGHTARROW" "css_training_key RIGHTARROW"
bind "ENTER" "css_training_key ENTER"
bind "BACKSPACE" "css_training_key BACKSPACE"
bind "PGDN" "css_training_key PGDN"
// Alternative without F keys, run manually on the server and in your client:
// css_training_bind focus K
// css_training_bind visible L
// bind "K" "css_training_key K"
// bind "L" "css_training_key L"
