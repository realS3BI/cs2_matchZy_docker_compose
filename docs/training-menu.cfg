// Optional CLIENT config: copy into Counter-Strike Global Offensive/game/csgo/cfg/.
// Execute once: exec training-menu
// Save your existing F6/F7 binds first. Movement/Use/Inspect/Reload need no extra binds.
bind "F6" "css_training"
bind "F7" "css_training_visible"
// F6 toggles panel control. The visible panel stays on screen while playing.
// F7 hides/shows the panel, preserving selection; hiding also releases control.
// R/Reload cycles long descriptions while controlling the panel.
