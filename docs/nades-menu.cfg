// Optional CLIENT config. Copy to your local Counter-Strike Global Offensive/game/csgo/cfg/.
// Run: exec nades-menu
// These replace your current number-key binds. Save custom binds first.
// Outside the menu, keys still select their normal weapon slots.
bind "1" "slot1; css_nades_select 1"
bind "2" "slot2; css_nades_select 2"
bind "3" "slot3; css_nades_select 3"
bind "4" "slot4; css_nades_select 4"
bind "5" "slot5; css_nades_select 5"
bind "6" "slot6; css_nades_select 6"
bind "7" "slot7; css_nades_select 7"
bind "8" "slot8; css_nades_select 8"
bind "9" "slot9; css_nades_select 9"

