name: Trainingspanel veröffentlichen

on:
  workflow_dispatch:
    inputs:
      publish:
        description: VPK auf das bestehende Workshop-Item 3810441722 hochladen
        type: boolean
        default: false
      visibility:
        description: Sichtbarkeit bei einem Upload
        type: choice
        default: keep
        options:
          - keep
          - public
          - friends
          - private
          - unlisted
      change_note:
        description: Änderungsnotiz für Steam, einzeilig
        type: string
        default: Trainingspanel aktualisiert

permissions:
  contents: read

concurrency:
  group: training-hud-workshop-3810441722
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Windows, X64, cs2-workshop]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release-Skript ohne Steam-Zugriff prüfen
        run: ./training-hud/test-release.ps1
      - name: Panel bauen und optional hochladen
        env:
          CS2_PATH: ${{ vars.CS2_PATH }}
          STEAMCMD_PATH: ${{ vars.STEAMCMD_PATH }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          PUBLISH: ${{ inputs.publish }}
          VISIBILITY: ${{ inputs.visibility }}
          CHANGE_NOTE: ${{ inputs.change_note }}
        run: |
          if (-not $env:CS2_PATH) { throw 'Repository-Variable CS2_PATH fehlt.' }
          ./training-hud/release.ps1 -Cs2 $env:CS2_PATH -Publish:($env:PUBLISH -eq 'true') -Visibility $env:VISIBILITY -ChangeNote $env:CHANGE_NOTE
      - name: Gebautes Panel sichern
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: training-hud-${{ github.sha }}
          if-no-files-found: error
          path: |
            training-hud/dist/panorama/
            training-hud/dist/workshop/
            training-hud/dist/release.json
          retention-days: 30
