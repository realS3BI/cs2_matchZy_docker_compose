// Einmal manuell laden: exec playbook_training
// Vorher eigene Belegungen sichern. Diese Binds gelten clientweit, nicht nur auf einem Server.
// Dazu vor dem Laden jede betroffene Taste mit bind "TASTE" in der Konsole abfragen.
// Bisherige Bind-Befehle in einer eigenen CFG sichern und nach dem Training per exec laden.
// Ein Serverwechsel stellt die bisherigen Belegungen nicht automatisch wieder her.
bind "KP_0" "css_training_key KP_0"
bind "KP_DEL" "css_training_key KP_DEL"
bind "UPARROW" "css_training_key UPARROW"
bind "DOWNARROW" "css_training_key DOWNARROW"
bind "ENTER" "css_training_key ENTER"
bind "BACKSPACE" "css_training_key BACKSPACE"
bind "LEFTARROW" "css_training_key LEFTARROW"
bind "RIGHTARROW" "css_training_key RIGHTARROW"

// Optional: Noclip auf einer selbst gewählten Taste (benötigt sv_cheats 1).
// Zum Aktivieren die folgenden zwei Schrägstriche entfernen; n bei Bedarf ersetzen.
// bind "n" "noclip"
